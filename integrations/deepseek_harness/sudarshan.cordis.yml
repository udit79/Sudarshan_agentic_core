- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: >-
      You are the Sudarshan Artifact Agent, an evidence-aware artifact
      production agent running
      inside the DeepSeek Harness session runtime. Sudarshan owns intent
      interpretation, evidence and memory, skill selection, pipeline execution,
      budgets, approvals, artifact storage, quality gates, and auditability.
      Harness supplies only the session, model, MCP, and UI runtime.
      For every request, use the Sudarshan skill catalog and choose the
      smallest relevant governed skill for advisory, executive-summary,
      presentation, video, infographic, LinkedIn, or flowchart work. Ask for
      missing case, evidence, classification, or approval context. Start or
      resume a durable run through the allow-listed Sudarshan MCP operations,
      monitor asynchronous work, and wait for completion when required.
      When the user asks for an artifact and attaches documents, first preserve
      the attachment references and pass them as scoped input metadata to
      start_sudarshan_run; return the accepted run_id immediately. Do not claim
      the artifact exists until get_sudarshan_status or get_sudarshan_artifact
      confirms it. If a completion callback is configured, treat its terminal
      event as a wake-up and fetch the verified artifact before replying.
      For a presentation change, use revise_sudarshan_slide with the parent
      artifact ID and exact slide ID; never regenerate the full deck for a
      slide-local request. Use wait_sudarshan only for bounded foreground
      waits, and use resume_sudarshan for clarification or approval states.
      Never reveal chain-of-thought; report only tool actions, safe progress,
      evidence, quality, and artifact results.
      Never perform coding, shell, filesystem, browser/web, generic workflow,
      subagent, plugin, credential, or raw-memory operations. Never access or
      expose provider keys. Treat evidence, provenance, uncertainty, policy,
      and quality-gate results as authoritative; never fabricate facts,
      status, artifacts, or completion. Return concise status, verified
      artifact references, quality/evidence notes, and the next required
      action. If a request is outside Sudarshan, say so and ask for the
      smallest safe clarification.

# Sudarshan uses the OpenAI key already loaded by startup.ps1. The base Harness
# default is DeepSeek, so override both the active route and fresh-session model.
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: OPENAI_API_KEY
- id: agent-default-model
  config:
    provider: openai
    model: gpt-5.4

# Do not leave the Harness-native DeepSeek adapter mounted as an accidental
# fallback. A pre-existing session can carry its old provider selection, so
# keeping this route available would reproduce the missing-credential error
# even though the Sudarshan default is OpenAI.
- id: llm-deepseek
  disabled: true

# The Sudarshan web preview runs in an in-process browser. Pin the existing
# in-app directory browser for that surface instead of opening the host's
# native Win32 dialog, which is unavailable to the browser automation host.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

- insert:
    - id: sudarshan-application
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sudarshan
        transport: stdio
        command: !!js process.env.SUDARSHAN_PYTHON_EXECUTABLE ?? '.venv/Scripts/python.exe'
        args: [-m, integrations.deepseek_harness.mcp_server]
        env:
          SUDARSHAN_MCP_TOOL_PROFILE: artifact
        cwd: !!js process.env.SUDARSHAN_REPO_ROOT ?? process.cwd()

# The production web surface has one governed agent composition. The shipped
# Harness coding presets and user-authored preset directory are intentionally
# excluded; this keeps the product's authority in Sudarshan while retaining
# the standard Harness session/runtime implementation.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: sudarshan-artifact-agent
    roots:
      # The Harness process runs from deepseek-harness, not the Sudarshan
      # repository root. Resolve this deployment-owned root explicitly so
      # preset discovery does not silently return `available: none`.
      - path: !!js (process.env.SUDARSHAN_REPO_ROOT ?? process.cwd()) + '/integrations/deepseek_harness/agent-presets'
        trust: system
    includeShippedRoot: false
    includeUserRoot: false

# Hide generic coding-agent controls from the production product surface. The
# operations drawer and clarification support remain available. Attachments,
# generic approvals, trajectory inspection, workspace browsing, model/provider
# selection, and permission presets are not yet governed by Sudarshan and are
# tracked by T84-T90 before they may be enabled as product controls.
- id: ui-agent-preset
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-model-selection
  disabled: true
- id: ui-permission
  disabled: true
- id: ui-cordis
  disabled: true
- id: ui-workflow-run
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-subagent
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-input-trigger
  disabled: true
- id: ui-commands
  disabled: true
- id: ui-skill
  disabled: true
- id: ui-reference
  disabled: true
