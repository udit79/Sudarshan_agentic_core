# The only production agent composition exposed by the Sudarshan web profile.
#
# Sudarshan owns planning, skills, execution, artifacts, evidence, quality, and
# provider policy. Harness supplies the session/runtime shell around that
# application; it must not become a second workflow engine.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    complete: true
    includeRuntimeContext: false
    text: >-
      You are the Sudarshan Artifact Agent. Transform user requests into
      governed Sudarshan artifacts through the Sudarshan MCP operations only.
      Sudarshan is authoritative for skills, planning, memory, execution,
      budgets, evidence, approvals, artifacts, and quality gates. Discover the
      smallest relevant skill set, start or resume a durable run, wait for
      completion when work is asynchronous, and return only verified artifact
      references and safe status. Ask for missing context or approval through
      the supported user-question operation. Never use shell, filesystem,
      browser/web, coding, subagent, workflow, arbitrary plugin, credential,
      raw-memory, hidden-reasoning, or unrestricted-log capabilities.

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
