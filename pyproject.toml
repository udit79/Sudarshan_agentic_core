[project]
name = "sudarshan-agentic-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.15.20,<2.0.0",
    "openai>=2.30.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pillow>=12.3.0",
    "pypdf>=6.17.0",
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = [
    "memory/tests",
    "pipelines/tests",
    "injestion/tests",
]
pythonpath = ["."]
