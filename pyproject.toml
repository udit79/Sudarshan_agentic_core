[project]
name = "sudarshan-agentic-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.15.20,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0.0",
    "openai>=2.30.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pillow>=12.3.0",
    "pypdf>=6.17.0",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.0",
    "google-genai>=2.0.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.10.0",
    "imageio-ffmpeg>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "memory/tests",
    "pipelines/tests",
    "ingestion_pipelines/tests",
]
pythonpath = ["."]
