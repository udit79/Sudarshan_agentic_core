[project]
name = "sudarshan-agentic-core"
version = "0.1.0"
description = "Sudarshan Agentic Core — NTRO Intelligent Advisory Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.15.20,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0,<4.0.0",
    "openai>=2.30.0,<3.0.0",
    "mcp>=1.28.0,<2.0.0",
    # Starlette 1.6 still references AnyIO's deprecated BlockingPortal alias.
    "anyio>=4.0,<4.15",
    "pydantic>=2.0.0,<3.0.0",
    "pillow>=12.3.0",
    "pypdf>=6.17.0",
    "pytesseract>=0.3.13",
    "python-pptx>=1.0.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.10.0",
    "imageio-ffmpeg>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.2.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "memory/tests",
    "pipelines/tests",
    "ingestion_pipelines/tests",
    "api/tests",
]
pythonpath = ["."]
cache_dir = "artifacts/.pytest_cache"
addopts = "--basetemp=artifacts/.pytest-tmp"
# CrewAI 1.15.20 emits this benign ImportWarning from its custom rag module
# while Python attaches the embeddings child module. Keep strict warning mode
# enabled for application and other dependency warnings.
filterwarnings = [
    "ignore:Cannot set an attribute on 'crewai\\.rag' for child module 'embeddings':ImportWarning",
]
